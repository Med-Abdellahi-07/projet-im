<!DOCTYPE html>
<html lang="fr">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Équipements · Industriel &amp; Minier</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="app">
            <aside class="sidebar">
                <div class="sidebar-marque">
                    <span class="pastille">IM</span>
                    <span class="texte-marque">Industriel &amp; Minier<small>Suivi des équipements</small></span>
                </div>
                <nav class="sidebar-nav">
                    <a href="accueil.html" class="lien-nav">
                        <svg class="icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5.5 9.5V20a1 1 0 0 0 1 1H9.5v-6h5v6H17.5a1 1 0 0 0 1-1V9.5"/></svg>
                        <span>Accueil</span>
                    </a>
                    <a href="index.html" class="lien-nav actif">
                        <svg class="icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 3 7.5v9L12 21l9-4.5v-9L12 3z"/><path d="M3 7.5 12 12l9-4.5"/><path d="M12 12v9"/></svg>
                        <span>Équipements</span>
                    </a>
                    <a href="pannes.html" class="lien-nav">
                        <svg class="icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="14" height="18" rx="1.5"/><path d="M8.5 8h7M8.5 12h7M8.5 16h4"/></svg>
                        <span>Pannes</span>
                    </a>
                    <a href="interventions.html" class="lien-nav">
                        <svg class="icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="14" height="18" rx="1.5"/><path d="M8.5 12.5l2 2 4-4.5"/></svg>
                        <span>Interventions</span>
                    </a>
                    <a href="dashboard.html" class="lien-nav">
                        <svg class="icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10"/><path d="M11 20V4"/><path d="M18 20v-7"/></svg>
                        <span>Tableau de bord</span>
                    </a>
                </nav>
                <div class="sidebar-pied">
                    <div class="utilisateur-carte">
                        <span class="utilisateur-avatar" id="avatar-utilisateur">?</span>
                        <span class="utilisateur-email" id="email-utilisateur"></span>
                    </div>
                    <a href="#" id="lien-deconnexion" class="lien-nav">
                        <svg class="icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h3"/><path d="M15 16l4-4-4-4"/><path d="M19 12H9"/></svg>
                        <span>Déconnexion</span>
                    </a>
                </div>
            </aside>

            <div class="principal">
                <header class="barre-haut">
                    <h1>Équipements</h1>
                    <p>Ajouter, modifier et rechercher les équipements suivis</p>
                </header>

                <main class="contenu">
                    <div class="carte">
                        <div class="carte-titre">Nouvel équipement</div>
                        <form id="form-equipement">
                            <div class="grille-formulaire">
                                <div>
                                    <label for="code">Code</label>
                                    <input type="text" id="code" name="code" placeholder="ex. EQ004">
                                    <div class="erreur" id="erreur-code"></div>
                                </div>
                                <div>
                                    <label for="designation">Désignation</label>
                                    <input type="text" id="designation" name="designation" placeholder="ex. Compresseur">
                                    <div class="erreur" id="erreur-designation"></div>
                                </div>
                                <div>
                                    <label for="type">Type</label>
                                    <input type="text" id="type" name="type" placeholder="ex. Pompe, camion, foreuse">
                                </div>
                                <div>
                                    <label for="localisation">Localisation</label>
                                    <input type="text" id="localisation" name="localisation" placeholder="ex. Zone A">
                                </div>
                                <div>
                                    <label for="etat">État</label>
                                    <select id="etat" name="etat">
                                        <option value="En service">En service</option>
                                        <option value="En panne">En panne</option>
                                        <option value="En maintenance">En maintenance</option>
                                    </select>
                                </div>
                                <div>
                                    <label for="date_equipement">Date de mise en service</label>
                                    <input type="date" id="date_equipement" name="date_equipement">
                                    <div class="erreur" id="erreur-date"></div>
                                </div>
                            </div>
                            <div class="actions-formulaire">
                                <button type="submit">Enregistrer</button>
                                <button type="button" class="secondaire" id="bouton-annuler-equipement" style="display:none;">Annuler la modification</button>
                            </div>
                        </form>
                    </div>

                    <div class="carte">
                        <div class="carte-titre">Liste des équipements</div>
                        <div class="filtres">
                            <input type="text" id="recherche-equipement" placeholder="Rechercher par code ou localisation">
                            <input type="text" id="filtre-type" placeholder="Filtrer par type">
                            <select id="filtre-etat">
                                <option value="">Tous les états</option>
                                <option value="En service">En service</option>
                                <option value="En panne">En panne</option>
                                <option value="En maintenance">En maintenance</option>
                            </select>
                        </div>
                        <div class="tableau-wrap">
                            <table>
                                <thead>
                                    <tr>
                                        <th>Code</th>
                                        <th>Désignation</th>
                                        <th>Type</th>
                                        <th>Localisation</th>
                                        <th>État</th>
                                        <th>Date</th>
                                        <th>Actions</th>
                                    </tr>
                                </thead>
                                <tbody id="corps-tableau-equipements"></tbody>
                            </table>
                        </div>
                    </div>
                </main>
            </div>
        </div>

        <script src="script.js"></script>
    </body>
</html>
