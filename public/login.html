<!DOCTYPE html>
<html lang="fr">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Connexion · Industriel &amp; Minier</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="ecran-auth">
            <div class="carte-auth">
                <div class="marque-auth">
                    <span class="pastille">IM</span>
                    <span class="texte">Industriel &amp; Minier</span>
                </div>

                <h1>Connexion</h1>
                <p class="soustitre">Accédez au suivi des équipements, pannes et interventions.</p>

                <div class="message-succes" id="message-succes" style="display:none;"></div>
                <div class="message-erreur-globale" id="message-erreur-globale"></div>

                <form id="form-connexion">
                    <label for="email">Adresse email</label>
                    <input type="email" id="email" name="email" placeholder="nom@exemple.com" autocomplete="email">
                    <div class="erreur" id="erreur-email"></div>

                    <label for="mot_de_passe">Mot de passe</label>
                    <input type="password" id="mot_de_passe" name="mot_de_passe" placeholder="mot de passe" autocomplete="current-password">
                    <div class="erreur" id="erreur-mot-de-passe"></div>

                    <div class="actions-formulaire">
                        <button type="submit" class="pleine-largeur">Se connecter</button>
                    </div>
                </form>

                <p class="lien-bas">Pas encore de compte ? <a href="inscription.html">Créer un compte</a></p>
            </div>
        </div>

        <script>
            const API_URL = "http://localhost:3000/api";

            const params = new URLSearchParams(window.location.search);
            if (params.get("verifie") === "1") {
                const succes = document.getElementById("message-succes");
                succes.textContent = "Votre compte a été vérifié avec succès. Vous pouvez vous connecter.";
                succes.style.display = "block";
            }

            function afficherErreurChamp(id, message) {
                const el = document.getElementById(id);
                el.textContent = message;
                el.classList.add("visible");
            }

            function cacherErreurChamp(id) {
                const el = document.getElementById(id);
                el.classList.remove("visible");
                el.textContent = "";
            }

            function afficherErreurGlobale(message) {
                const el = document.getElementById("message-erreur-globale");
                el.textContent = message;
                el.classList.add("visible");
            }

            function cacherErreurGlobale() {
                const el = document.getElementById("message-erreur-globale");
                el.classList.remove("visible");
            }

            document.getElementById("form-connexion").addEventListener("submit", async function (e) {
                e.preventDefault();
                cacherErreurGlobale();

                const email = document.getElementById("email").value.trim();
                const mot_de_passe = document.getElementById("mot_de_passe").value;

                let valide = true;
                if (email === "") {
                    afficherErreurChamp("erreur-email", "L'adresse email est obligatoire.");
                    valide = false;
                } else {
                    cacherErreurChamp("erreur-email");
                }
                if (mot_de_passe === "") {
                    afficherErreurChamp("erreur-mot-de-passe", "Le mot de passe est obligatoire.");
                    valide = false;
                } else {
                    cacherErreurChamp("erreur-mot-de-passe");
                }
                if (!valide) return;

                const bouton = e.target.querySelector("button[type=submit]");
                bouton.disabled = true;
                bouton.textContent = "Connexion...";

                try {
                    const reponse = await fetch(`${API_URL}/auth/connexion`, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ email, mot_de_passe })
                    });
                    const resultat = await reponse.json();

                    if (reponse.status === 403 && resultat.nonVerifie) {
                        sessionStorage.setItem("emailEnAttenteVerification", email);
                        window.location.href = "verification.html?depuis=login";
                        return;
                    }

                    if (!reponse.ok) {
                        afficherErreurGlobale(resultat.message || "Email ou mot de passe incorrect.");
                        bouton.disabled = false;
                        bouton.textContent = "Se connecter";
                        return;
                    }

                    localStorage.setItem("utilisateurConnecte", JSON.stringify(resultat.utilisateur));
                    window.location.href = "accueil.html";
                } catch (erreur) {
                    console.error(erreur);
                    afficherErreurGlobale("Impossible de contacter le serveur. Vérifiez qu'il est bien démarré (npm start dans le dossier backend).");
                    bouton.disabled = false;
                    bouton.textContent = "Se connecter";
                }
            });
        </script>
    </body>
</html>
