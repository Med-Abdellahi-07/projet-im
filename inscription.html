<!DOCTYPE html>
<html lang="fr">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Créer un compte · Industriel &amp; Minier</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="ecran-auth">
            <div class="carte-auth">
                <div class="marque-auth">
                    <span class="pastille">IM</span>
                    <span class="texte">Industriel &amp; Minier</span>
                </div>

                <h1>Créer un compte</h1>
                <p class="soustitre">L'inscription se fait par email : un code de vérification vous sera envoyé.</p>

                <div class="message-erreur-globale" id="message-erreur-globale"></div>

                <form id="form-inscription">
                    <label for="email">Adresse email</label>
                    <input type="email" id="email" name="email" placeholder="nom@exemple.com" autocomplete="email">
                    <div class="erreur" id="erreur-email"></div>

                    <label for="mot_de_passe">Mot de passe</label>
                    <input type="password" id="mot_de_passe" name="mot_de_passe" placeholder="6 caractères minimum" autocomplete="new-password">
                    <div class="erreur" id="erreur-mot-de-passe"></div>

                    <label for="confirmation">Confirmer le mot de passe</label>
                    <input type="password" id="confirmation" name="confirmation" placeholder="retapez le mot de passe" autocomplete="new-password">
                    <div class="erreur" id="erreur-confirmation"></div>

                    <div class="actions-formulaire">
                        <button type="submit" class="pleine-largeur">Créer mon compte</button>
                    </div>
                </form>

                <p class="lien-bas">Déjà un compte ? <a href="login.html">Se connecter</a></p>
            </div>
        </div>

        <script>
            const API_URL = "http://localhost:3000/api";

            function afficherErreurChamp(id, message) {
                const el = document.getElementById(id);
                el.textContent = message;
                el.classList.add("visible");
            }
            function cacherErreurChamp(id) {
                const el = document.getElementById(id);
                el.classList.remove("visible");
                el.textContent = "";
            }
            function afficherErreurGlobale(message) {
                const el = document.getElementById("message-erreur-globale");
                el.textContent = message;
                el.classList.add("visible");
            }
            function cacherErreurGlobale() {
                document.getElementById("message-erreur-globale").classList.remove("visible");
            }

            document.getElementById("form-inscription").addEventListener("submit", async function (e) {
                e.preventDefault();
                cacherErreurGlobale();

                const email = document.getElementById("email").value.trim();
                const mot_de_passe = document.getElementById("mot_de_passe").value;
                const confirmation = document.getElementById("confirmation").value;

                let valide = true;

                if (email === "" || !email.includes("@")) {
                    afficherErreurChamp("erreur-email", "Entrez une adresse email valide.");
                    valide = false;
                } else {
                    cacherErreurChamp("erreur-email");
                }

                if (mot_de_passe.length < 6) {
                    afficherErreurChamp("erreur-mot-de-passe", "Le mot de passe doit contenir au moins 6 caractères.");
                    valide = false;
                } else {
                    cacherErreurChamp("erreur-mot-de-passe");
                }

                if (confirmation !== mot_de_passe || confirmation === "") {
                    afficherErreurChamp("erreur-confirmation", "Les deux mots de passe ne correspondent pas.");
                    valide = false;
                } else {
                    cacherErreurChamp("erreur-confirmation");
                }

                if (!valide) return;

                const bouton = e.target.querySelector("button[type=submit]");
                bouton.disabled = true;
                bouton.textContent = "Création...";

                try {
                    const reponse = await fetch(`${API_URL}/auth/inscription`, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ email, mot_de_passe })
                    });
                    const resultat = await reponse.json();

                    if (!reponse.ok) {
                        afficherErreurGlobale(resultat.message || "Impossible de créer le compte.");
                        bouton.disabled = false;
                        bouton.textContent = "Créer mon compte";
                        return;
                    }

                    sessionStorage.setItem("emailEnAttenteVerification", email);
                    if (resultat.codeDeTest) {
                        sessionStorage.setItem("codeDeTest", resultat.codeDeTest);
                    }
                    window.location.href = "verification.html?depuis=inscription";
                } catch (erreur) {
                    console.error(erreur);
                    afficherErreurGlobale("Impossible de contacter le serveur. Vérifiez qu'il est bien démarré (npm start dans le dossier backend).");
                    bouton.disabled = false;
                    bouton.textContent = "Créer mon compte";
                }
            });
        </script>
    </body>
</html>
